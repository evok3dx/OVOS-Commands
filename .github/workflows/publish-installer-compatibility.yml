name: Publish owner-authorised Jarvis release

on:
  push:
    branches: [work/publish-v4.9.0]
    paths:
      - .github/workflows/publish-installer-compatibility.yml

permissions:
  contents: read

concurrency:
  group: publish-reviewed-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/work/publish-v4.9.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify exact source and successful validation runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: evok3dx/OVOS-Commands
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          source_sha=8d8b6ad37e8c9d48d7c46bc5ce3e1c20fe5f8086
          for run_id in 40391067916 40391067762; do
            gh api "repos/$GH_REPO/actions/runs/$run_id" \
              --jq '[.head_sha, .status, .conclusion] | @tsv' | \
              grep -Fx "$source_sha"$'\tcompleted\tsuccess'
          done
          gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha' | \
            grep -Fx "$source_sha"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '12682637044'
          run-id: '40391067762'
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '12682941810'
          run-id: '40391067762'
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/notes
      - name: Publish validated stable assets and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: evok3dx/OVOS-Commands
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 11
          source_sha=8d8b6ad37e8c9d48d7c46bc5ce3e1c20fe5f8086
          sed -i 's|(releases.md)|(https://github.com/evok3dx/OVOS-Commands/blob/main/docs/releases.md)|g' "$RUNNER_TEMP/notes/release-notes.md"
          gh release create v4.9.0 --target "$source_sha" \
            --title 'Jarvis 4.9.0' --draft \
            --notes-file "$RUNNER_TEMP/notes/release-notes.md"
          gh release upload v4.9.0 \
            ovos-commands-4.9.0.tar.gz ovos-commands-4.9.0.tar.gz.sha256 \
            ovos_skill_jarvis_dispatcher-4.9.0-py3-none-any.whl \
            ovos_skill_jarvis_media-0.3.6-py3-none-any.whl \
            jarvis_file_search_skill-0.3.0-py3-none-any.whl \
            jarvis-runtime-linux-x86_64-py311.zip jarvis-runtime-linux-x86_64-py311.zip.sha256 \
            third-party-licenses.json espeak-ng-COPYING RUNTIME-NOTICES.md SHA256SUMS
          gh release edit v4.9.0 --draft=false --prerelease=false --latest
          mkdir -m 700 "$RUNNER_TEMP/public-download"
          gh release download v4.9.0 --dir "$RUNNER_TEMP/public-download"
          cd "$RUNNER_TEMP/public-download"
          sha256sum --check SHA256SUMS
          cmp SHA256SUMS "$RUNNER_TEMP/assets/SHA256SUMS"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 11
          gh api "repos/$GH_REPO/git/ref/tags/v4.9.0" \
            --jq '.object.sha' | grep -Fx "$source_sha"
          gh release view v4.9.0 --json url,isPrerelease,isDraft
