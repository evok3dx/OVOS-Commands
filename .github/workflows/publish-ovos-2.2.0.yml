name: Publish OVOS Commands 2.2.0 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Verify and publish the tested source archive
        shell: bash
        run: |
          set -euo pipefail

          archive="ovos-commands-2.2.0.tar.gz"
          expected="4f57c89d54b2cfab74a37c4f9621545b2fed6e2d38b0c6786c8f832df9a3909f"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"

          staging="$(mktemp -d)"
          tar -xzf "$archive" -C "$staging"
          source_root="$staging/ovos-commands-2.2.0"

          test -f "$source_root/scripts/install.sh"
          test -f "$source_root/compatibility.json"
          test -f "$source_root/pyproject.toml"
          grep -Fxq 'version = "2.2.0"' "$source_root/pyproject.toml"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$source_root"/. .

          python3 scripts/validate_refactor.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release experimental Jarvis 2.2.0"
          git tag -a v2.2.0 -m "Experimental Jarvis 2.2.0"
          git push origin HEAD:main
          git push origin v2.2.0
