name: Rebuild V4 runtime candidate

on:
  push:
    branches: [work/v4]
    paths:
      - .github/workflows/rebuild-runtime.yml
      - scripts/rebuild-runtime.py
      - voice/runtime-rebuild-inputs.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.16'
      - name: Check ordinary-user build boundary
        run: test "$(id -u)" -ne 0
      - name: Prepare native ALSA runtime only
        run: sudo apt-get install --no-install-recommends --yes libasound2t64
      - name: Recover and fully validate the candidate
        run: python3 scripts/rebuild-runtime.py --output "$RUNNER_TEMP/jarvis-runtime-rebuild"
      - name: Upload validated candidate and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jarvis-v4-runtime-candidate
          path: |
            ${{ runner.temp }}/jarvis-runtime-rebuild/candidate/
            ${{ runner.temp }}/jarvis-runtime-rebuild/proof/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload small hash policies and verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jarvis-v4-runtime-proof
          path: |
            ${{ runner.temp }}/jarvis-runtime-rebuild/candidate/*.json
            ${{ runner.temp }}/jarvis-runtime-rebuild/candidate/*.txt
            ${{ runner.temp }}/jarvis-runtime-rebuild/proof/
          if-no-files-found: error
          retention-days: 7
