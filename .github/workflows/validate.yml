name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gtk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare native GTK test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends python3-gi gir1.2-gtk-3.0 xvfb xauth
      - name: Test real GTK default-app picker as ordinary user
        run: xvfb-run --auto-servernum /usr/bin/python3 scripts/test-default-app-picker-gtk.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jarvis-dashboard-previews
          path: ${{ runner.temp }}/Jarvis-Dashboard-*.png
          if-no-files-found: error
          retention-days: 14
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch checksum-pinned review tools
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/jarvis-security-tools"
          mkdir -m 700 "$tools_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tools_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$tools_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tools_dir/gitleaks.tar.gz" -C "$tools_dir" gitleaks
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            -o "$tools_dir/shellcheck.tar.gz"
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$tools_dir/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$tools_dir/shellcheck.tar.gz" -C "$tools_dir" shellcheck-v0.11.0/shellcheck
          printf '%s\n' "$tools_dir" "$tools_dir/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Scan source and history without exposing values
        run: |
          bash scripts/security-audit.sh quick
          bash scripts/security-audit.sh history
      - name: Review production shell warnings
        run: |
          shellcheck --severity=warning scripts/install.sh scripts/build-release.sh \
            scripts/security-audit.sh system_helpers/jarvis-app-window \
            system_helpers/jarvis-focused-navigation system_helpers/jarvis-read-visible-text \
            system_helpers/jarvis-speechnote-setup system_helpers/jarvis-restart
      - name: Scan actual release contents
        run: |
          bash scripts/build-release.sh
          archive="$(find dist -maxdepth 1 -name 'ovos-commands-*.tar.gz' -print -quit)"
          bash scripts/security-audit.sh release "$archive"
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/validate_refactor.py
      - name: Required routing and updater checks
        run: |
          python3 scripts/test-v3-routing.py
          python3 scripts/test-qwen-safe-workflows.py
          python3 scripts/test-update-security.py
          python3 scripts/test-release-privacy.py
      - name: Test desktop regressions
        run: |
          bash scripts/test-window-matching.sh
          bash scripts/test-focused-navigation.sh
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -qE '^#!.*(ba)?sh'; then
              bash -n "$file"
            fi
          done < <(find scripts system_helpers mic -type f -print0)
      - name: Test isolated install and rollback
        run: bash scripts/test-deployment.sh
      - name: Test exact hash-locked upstream boot skill
        if: matrix.python-version == '3.11'
        run: |
          mkdir -m 700 "$RUNNER_TEMP/jarvis-boot-wheel"
          python3 -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/jarvis-boot-wheel" 'ovos-skill-boot-finished==0.7.0a2'
          python3 scripts/test-boot-readiness.py "$RUNNER_TEMP/jarvis-boot-wheel/ovos_skill_boot_finished-0.7.0a2-py3-none-any.whl"
          python3 -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/jarvis-boot-wheel" 'padacioso==2.4.2a1'
          python3 scripts/test-intent-cleanup.py "$RUNNER_TEMP/jarvis-boot-wheel/padacioso-2.4.2a1-py3-none-any.whl"
          python3 -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/jarvis-boot-wheel" 'ovos-skill-weather==1.4.8a1' 'ovos-core==3.7.0a1'
          python3 scripts/test-weather-location.py "$RUNNER_TEMP/jarvis-boot-wheel/ovos_skill_weather-1.4.8a1-py3-none-any.whl"
          python3 scripts/test-isolated-media-routing.py "$RUNNER_TEMP/jarvis-boot-wheel/ovos_core-3.7.0a1-py3-none-any.whl"
      - name: Build and inspect release
        run: bash scripts/build-release.sh
      - name: Verify clean release copy and full policy benchmark
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("compatibility.json"))["release_version"])')"
          (cd dist && sha256sum --check "ovos-commands-$version.tar.gz.sha256")
          clean_dir="$RUNNER_TEMP/jarvis-clean-release"
          mkdir -m 700 "$clean_dir"
          tar -xzf "dist/ovos-commands-$version.tar.gz" -C "$clean_dir"
          cd "$clean_dir/ovos-commands-$version"
          python3 scripts/validate_refactor.py
          python3 scripts/test-v3-routing.py
          python3 scripts/test-qwen-safe-workflows.py
          python3 scripts/test-update-security.py
          bash scripts/test-deployment.sh
          python3 scripts/routing-benchmark.py --policy-only --output "$RUNNER_TEMP/jarvis-clean-routing.md"
      - name: Fetch immutable legacy packaging source for host compatibility
        if: matrix.python-version == '3.11'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pypa/packaging
          ref: d8e3b31b734926ebbcaff654279f6855a73e052f # 24.2
          path: .jarvis-legacy-packaging-host
          persist-credentials: false
      - name: Reproduce legacy prerelease filtering and verify the complete closure
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: ${{ github.workspace }}/.jarvis-legacy-packaging-host/src
        run: |
          python3 scripts/test-dependency-lock.py
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          import packaging
          from packaging.specifiers import SpecifierSet
          assert packaging.__version__ == '24.2'
          assert '0.22.17a1' not in SpecifierSet('>=0.4.0')
          verifier = runpy.run_path('scripts/dependency-lock.py')
          records = json.loads(Path('voice/runtime-wheels-linux-x86_64-py311.artifacts.json').read_text())['packages']
          inventory = json.loads(Path('voice/runtime-linux-x86_64-py311.json').read_text())
          assert verifier['verify_closure'](records, inventory) == []
          assert len(records) == 296
          print('PASS: real packaging 24.2 reproduces the former false conflict; all 296 exact reviewed dependencies pass with zero exemptions.')
          PY
      - name: Retain the validated development archive
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/work/isolation-installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jarvis-isolation-installer-candidate
          path: dist/ovos-commands-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
