name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/validate_refactor.py
      - name: Test desktop regressions
        run: |
          bash scripts/test-window-matching.sh
          bash scripts/test-focused-navigation.sh
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -qE '^#!.*(ba)?sh'; then
              bash -n "$file"
            fi
          done < <(find scripts system_helpers mic -type f -print0)
      - name: Test isolated install and rollback
        run: bash scripts/test-deployment.sh
      - name: Build and inspect release
        run: bash scripts/build-release.sh
