[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ww-plugin-openwakeword"
dynamic = ["version"]
description = "Jarvis ONNX-only build of the OpenVoiceOS openWakeWord plugin"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "dscripka", email = "david.scripka@gmail.com"}]
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "openwakeword>=0.5.0,<1",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    # This downstream build rejects TFLite and uses only the NumPy-2-compatible ONNX path.
    "numpy>=2,<3",
    "onnxruntime>=1.10.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest<9",
    "ovoscope>=0.19.0a1,<1.0.0",
    "ovos-dinkum-listener",
]

[project.entry-points."opm.wake_word"]
ovos-ww-plugin-openwakeword = "ovos_ww_plugin_openwakeword:OwwHotwordPlugin"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-ww-plugin-openwakeword"

[tool.setuptools.dynamic]
version = {attr = "ovos_ww_plugin_openwakeword.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_ww_plugin_openwakeword*"]
